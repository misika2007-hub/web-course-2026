<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1 class="app__title">Simon</h1>
    <p class="app__round">Уровень: <span id="round">0</span></p>

    <div class="board" id="board">
      <button type="button" class="sector sector--green" data-index="0" aria-label="Зелёный"></button>
      <button type="button" class="sector sector--red" data-index="1" aria-label="Красный"></button>
      <button type="button" class="sector sector--blue" data-index="2" aria-label="Синий"></button>
      <button type="button" class="sector sector--yellow" data-index="3" aria-label="Жёлтый"></button>
    </div>

    <p class="status" id="status">Нажмите «Старт», чтобы начать</p>

    <button type="button" class="start-btn" id="start-btn">Старт</button>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
